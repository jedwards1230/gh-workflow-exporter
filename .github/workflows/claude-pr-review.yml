# Claude PR review — calls the shared reusable workflow in
# jedwards1230/release-workflows, which runs claude-code-action@v1 in Haiku
# PR-review mode with the public jedwards1230-plugins marketplace + review-team
# plugin enabled by default. The focus below is appended to the base prompt.
#
# Fork PRs receive no secrets, so the review job no-ops for them; dependabot
# and draft PRs are skipped by the reusable itself.
name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, closed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.action != 'closed'
    uses: jedwards1230/release-workflows/.github/workflows/claude-pr-review.yml@ba35e100f83d7276cf4cf519ae89bb0597fca04c # v1.13.1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # preferred (subscription)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # fallback (metered API)
      LITELLM_CI_KEY: ${{ secrets.LITELLM_CI_KEY }}
      LENS_TRACING_KEY: ${{ secrets.LENS_TRACING_KEY }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      LITELLM_CI_BASE_URL: ${{ secrets.LITELLM_CI_BASE_URL }}
      LENS_CI_OTLP_ENDPOINT: ${{ secrets.LENS_CI_OTLP_ENDPOINT }}
    with:
      extra_plugins: |
        go-quality@jedwards1230-plugins
      focus: |
        gh-workflow-exporter is a single Go binary: a Prometheus exporter that
        authenticates as a GitHub App, polls the Actions API on an interval, and
        exposes per-workflow health metrics (last run conclusion, last scheduled
        success, expected cron interval, workflow state). Highest-value lenses:
        - Credentials: the App private key and installation tokens must never be
          logged, put in metric labels, or written to disk; token refresh must
          happen well before expiry and survive transient failures.
        - Metric correctness: label cardinality stays bounded (one series per
          workflow; stale label sets deleted when a conclusion or workflow
          changes), and gauges never move backwards to an older run.
        - API usage: requests are sequential and rate-limit aware; ETag /
          conditional requests and SHA-keyed caches are used correctly; runs are
          filtered client-side (never via ?event= / ?branch= query params);
          pagination is bounded.
        - Cron parsing: expected-interval math across multiple schedule entries
          and edge cases (step values, ranges, day-of-week/day-of-month).
        - Concurrency and lifecycle: poll loop vs /metrics handler races,
          context cancellation and graceful shutdown, /readyz semantics.
        - Public repo: flag any hostnames, IPs, or environment-specific details
          that leak into code, docs, or examples.
        - When the diff touches Go, prioritize the go-quality:go-reviewer agent
          for language-specific Go review.
        Do NOT re-flag gofmt/golangci-lint/go-mod-tidy/actionlint findings — CI
        owns those.

  cancel-review:
    if: github.event.action == 'closed'
    permissions:
      actions: write
    uses: jedwards1230/release-workflows/.github/workflows/claude-pr-review-cancel.yml@b185a6e7822f9c36822ed8e89e77b3d0fe229f96 # v1.12.0
    with:
      review_workflow: ${{ github.workflow }}
